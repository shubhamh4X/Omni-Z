<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stopColor="#1e1b4b" stopOpacity="0.6" />
      <stop offset="60%" stopColor="#0b0f19" stopOpacity="1" />
      <stop offset="100%" stopColor="#030712" stopOpacity="1" />
    </radialGradient>

    <!-- Toroidal Helix Gradients -->
    <linearGradient id="helixCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="40%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
    <linearGradient id="helixRose" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f43f5e" />
      <stop offset="40%" stopColor="#fb923c" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#f43f5e" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Window Shadow & Background -->
  <rect width="1200" height="720" rx="16" fill="url(#bgGlow)" />
  <rect x="0.5" y="0.5" width="1199" height="719" rx="15.5" stroke="#334155" stroke-opacity="0.5" fill="none" />

  <!-- Window Titlebar -->
  <rect width="1200" height="44" rx="16" fill="#0f172a" />
  <rect y="30" width="1200" height="14" fill="#0f172a" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="22" r="6" fill="#ef4444" />
  <circle cx="44" cy="22" r="6" fill="#f59e0b" />
  <circle cx="64" cy="22" r="6" fill="#10b981" />

  <!-- Window Title -->
  <text x="600" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
    Omni Z — Real-Time Dynamic AI Agent
  </text>

  <!-- Left Sidebar (Width 260) -->
  <g transform="translate(0, 44)">
    <rect width="260" height="676" fill="#0b0f19" />
    <line x1="260" y1="0" x2="260" y2="676" stroke="#1e293b" stroke-width="1" />

    <!-- App Brand in Sidebar -->
    <g transform="translate(20, 20)">
      <!-- Mini Toroidal Ring -->
      <circle cx="16" cy="16" r="14" stroke="url(#helixCyan)" stroke-width="2.5" fill="none" />
      <circle cx="16" cy="16" r="10" stroke="url(#helixRose)" stroke-width="2.5" fill="none" />
      <circle cx="16" cy="16" r="3" fill="#ffffff" />
      <text x="40" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.5">Omni Z</text>
    </g>

    <!-- "+ New Chat" Button -->
    <g transform="translate(18, 70)">
      <rect width="224" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="32" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">+ New Chat</text>
      <circle cx="196" cy="20" r="10" fill="#38bdf8" fill-opacity="0.15" />
      <text x="196" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⌘K</text>
    </g>

    <!-- Recent Chats Section -->
    <text x="22" y="145" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">RECENT CHATS</text>

    <!-- Chat Item 1 (Active) -->
    <g transform="translate(12, 160)">
      <rect width="236" height="38" rx="10" fill="#1e293b" />
      <circle cx="20" cy="19" r="4" fill="#38bdf8" />
      <text x="34" y="23" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Quantum Physics &amp; AI</text>
    </g>

    <!-- Chat Item 2 -->
    <g transform="translate(12, 204)">
      <rect width="236" height="38" rx="10" fill="transparent" />
      <circle cx="20" cy="19" r="4" fill="#64748b" />
      <text x="34" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Python Realtime Sandbox</text>
    </g>

    <!-- Chat Item 3 -->
    <g transform="translate(12, 248)">
      <rect width="236" height="38" rx="10" fill="transparent" />
      <circle cx="20" cy="19" r="4" fill="#64748b" />
      <text x="34" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Stock Market Live Grounding</text>
    </g>

    <!-- Chat Item 4 -->
    <g transform="translate(12, 292)">
      <rect width="236" height="38" rx="10" fill="transparent" />
      <circle cx="20" cy="19" r="4" fill="#64748b" />
      <text x="34" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">LaTeX Formula Generator</text>
    </g>

    <!-- Bottom User Bar -->
    <g transform="translate(16, 615)">
      <line x1="0" y1="-15" x2="228" y2="-15" stroke="#1e293b" stroke-width="1" />
      <circle cx="18" cy="18" r="16" fill="url(#accentGlow)" />
      <text x="18" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Z</text>
      <text x="44" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Google Account</text>
      <text x="44" y="30" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Cloud Sync Active</text>
    </g>
  </g>

  <!-- Main Canvas / Chat Area -->
  <g transform="translate(260, 44)">
    <!-- Top Header Bar -->
    <rect width="940" height="54" fill="#0f172a" fill-opacity="0.8" />
    <line x1="0" y1="54" x2="940" y2="54" stroke="#1e293b" stroke-width="1" />

    <!-- Model Selector -->
    <g transform="translate(24, 12)">
      <rect width="180" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="15" r="4" fill="#38bdf8" />
      <text x="30" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Gemini 2.5 Flash</text>
      <path d="M155 13L160 18L165 13" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Search Grounding Badge -->
    <g transform="translate(710, 12)">
      <rect width="206" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
      <text x="28" y="20" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Search Grounding: ON</text>
    </g>

    <!-- Center Hero Welcome Area -->
    <g transform="translate(470, 200)">
      <!-- Glowing Galaxy Toroidal DNA Ring -->
      <g filter="url(#softGlow)">
        <!-- Ambient outer rings -->
        <circle cx="0" cy="0" r="54" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 6" />
        <circle cx="0" cy="0" r="44" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 5" />
        <ellipse cx="0" cy="0" rx="38" ry="24" transform="rotate(-30)" stroke="url(#helixCyan)" stroke-width="4.5" fill="none" />
        <ellipse cx="0" cy="0" rx="38" ry="24" transform="rotate(30)" stroke="url(#helixRose)" stroke-width="4.5" fill="none" />
        <circle cx="0" cy="0" r="10" fill="#38bdf8" fill-opacity="0.3" />
        <circle cx="0" cy="0" r="4" fill="#ffffff" />
      </g>

      <!-- Headline -->
      <text x="0" y="85" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" text-anchor="middle" letter-spacing="-0.5">
        Hello, what can I do for you?
      </text>
      <text x="0" y="115" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" text-anchor="middle">
        Omni Z combines live web search, Python code sandbox, and multimodal intelligence.
      </text>
    </g>

    <!-- 4 Suggestion Cards -->
    <g transform="translate(150, 360)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="150" height="96" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <circle cx="28" cy="28" r="14" fill="#38bdf8" fill-opacity="0.15" />
        <text x="28" y="33" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">🌐</text>
        <text x="18" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Web Grounding</text>
        <text x="18" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Real-time search</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(164, 0)">
        <rect width="150" height="96" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <circle cx="28" cy="28" r="14" fill="#a855f7" fill-opacity="0.15" />
        <text x="28" y="33" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">🐍</text>
        <text x="18" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Python Sandbox</text>
        <text x="18" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Run live scripts</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(328, 0)">
        <rect width="150" height="96" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <circle cx="28" cy="28" r="14" fill="#f59e0b" fill-opacity="0.15" />
        <text x="28" y="33" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">📐</text>
        <text x="18" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">KaTeX Equations</text>
        <text x="18" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Math &amp; Physics</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(492, 0)">
        <rect width="150" height="96" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.15" />
        <text x="28" y="33" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">🎙️</text>
        <text x="18" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Audio &amp; Files</text>
        <text x="18" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Voice input &amp; PDFs</text>
      </g>
    </g>

    <!-- Bottom Input Bar -->
    <g transform="translate(130, 520)">
      <rect width="680" height="64" rx="32" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
      <!-- Attach Button -->
      <circle cx="36" cy="32" r="16" fill="#334155" />
      <path d="M31 32L36 27L41 32M36 28V37" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

      <!-- Input text placeholder -->
      <text x="68" y="37" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">
        Ask anything, run code, or search the web...
      </text>

      <!-- Mic icon -->
      <circle cx="586" cy="32" r="16" fill="#334155" />
      <circle cx="586" cy="30" r="5" fill="#94a3b8" />
      <path d="M583 33C583 35 589 35 589 33M586 35V37" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

      <!-- Send button -->
      <circle cx="634" cy="32" r="18" fill="url(#helixCyan)" />
      <path d="M629 32L634 27L639 32M634 28V37" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Disclaimer footer -->
    <text x="470" y="610" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
      Omni Z can display inaccurate info. Always verify search citations and code executions.
    </text>
  </g>
</svg>
