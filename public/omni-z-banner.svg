<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stopColor="#1e1b4b" stopOpacity="0.8" />
      <stop offset="45%" stopColor="#0f172a" stopOpacity="0.95" />
      <stop offset="100%" stopColor="#090a0f" stopOpacity="1" />
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.18" />
      <stop offset="100%" stopColor="#38bdf8" stopOpacity="0" />
    </radialGradient>
    <radialGradient id="nebulaRose" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stopColor="#f43f5e" stopOpacity="0.18" />
      <stop offset="100%" stopColor="#f43f5e" stopOpacity="0" />
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stopColor="#a855f7" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#a855f7" stopOpacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="strandCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="40%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
    <linearGradient id="strandRose" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f43f5e" />
      <stop offset="40%" stopColor="#fb923c" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="45%" stopColor="#e0e7ff" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="520" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="520" rx="16" fill="url(#nebulaCyan)" />
  <rect width="1200" height="520" rx="16" fill="url(#nebulaRose)" />
  <rect width="1200" height="520" rx="16" fill="url(#nebulaPurple)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="520" />
    <line x1="400" y1="0" x2="400" y2="520" />
    <line x1="600" y1="0" x2="600" y2="520" />
    <line x1="800" y1="0" x2="800" y2="520" />
    <line x1="1000" y1="0" x2="1000" y2="520" />
  </g>

  <!-- Star Field -->
  <g fill="#ffffff">
    <circle cx="80" cy="70" r="1.5" opacity="0.6" />
    <circle cx="150" cy="140" r="1" opacity="0.4" />
    <circle cx="230" cy="90" r="2" opacity="0.8" />
    <circle cx="310" cy="220" r="1" opacity="0.5" />
    <circle cx="420" cy="60" r="1.5" opacity="0.7" />
    <circle cx="550" cy="110" r="1" opacity="0.3" />
    <circle cx="680" cy="80" r="2" opacity="0.7" />
    <circle cx="790" cy="150" r="1.5" opacity="0.6" />
    <circle cx="890" cy="65" r="1" opacity="0.4" />
    <circle cx="1020" cy="120" r="2" opacity="0.8" />
    <circle cx="1110" cy="85" r="1" opacity="0.5" />
    <circle cx="1140" cy="230" r="1.5" opacity="0.6" />
    <circle cx="95" cy="380" r="1" opacity="0.4" />
    <circle cx="180" cy="440" r="1.5" opacity="0.7" />
    <circle cx="270" cy="360" r="2" opacity="0.6" />
    <circle cx="980" cy="420" r="1.5" opacity="0.7" />
    <circle cx="1080" cy="370" r="1" opacity="0.5" />
  </g>

  <!-- Left Side: Centered Celestial Toroidal Galaxy DNA Ring Logo -->
  <g transform="translate(140, 140)" filter="url(#glowEffect)">
    <!-- Outer ambient orbital ring -->
    <circle cx="120" cy="120" r="115" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25" />
    <circle cx="120" cy="120" r="95" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 6" opacity="0.3" />

    <!-- Core Glowing Sphere -->
    <circle cx="120" cy="120" r="75" fill="#38bdf8" fill-opacity="0.08" />

    <!-- Stylized Toroidal Helix Rings -->
    <ellipse cx="120" cy="120" rx="72" ry="46" transform="rotate(-30 120 120)" stroke="url(#strandCyan)" stroke-width="5" fill="none" opacity="0.95" />
    <ellipse cx="120" cy="120" rx="72" ry="46" transform="rotate(30 120 120)" stroke="url(#strandRose)" stroke-width="5" fill="none" opacity="0.9" />
    <ellipse cx="120" cy="120" rx="70" ry="24" transform="rotate(90 120 120)" stroke="#a855f7" stroke-width="3" stroke-dasharray="5 5" fill="none" opacity="0.8" />

    <!-- Orbital Base Nodes -->
    <circle cx="120" cy="48" r="5" fill="#38bdf8" />
    <circle cx="120" cy="192" r="5" fill="#f43f5e" />
    <circle cx="50" cy="120" r="4.5" fill="#818cf8" />
    <circle cx="190" cy="120" r="4.5" fill="#c084fc" />
    <circle cx="70" cy="80" r="4" fill="#38bdf8" />
    <circle cx="170" cy="160" r="4" fill="#fb923c" />
    <circle cx="170" cy="80" r="4" fill="#f43f5e" />
    <circle cx="70" cy="160" r="4" fill="#818cf8" />
  </g>

  <!-- Right Side: Typography & Badges -->
  <g transform="translate(460, 110)">
    <!-- Pill Badge: Version / Status -->
    <g transform="translate(0, 0)">
      <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="18" cy="16" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">REAL-TIME DYNAMIC AGENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">Omni Z</text>

    <!-- Subtitle Description -->
    <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      Next-Generation AI Assistant Powered by Google Gemini &amp; Firebase
    </text>

    <!-- Interactive Capabilities Showcase Badges -->
    <g transform="translate(0, 170)">
      <!-- Badge 1: Live Web Grounding -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="22" cy="21" r="5" fill="#38bdf8" />
        <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Live Web Search</text>
      </g>

      <!-- Badge 2: Python Code Execution -->
      <g transform="translate(195, 0)">
        <rect width="180" height="42" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="22" cy="21" r="5" fill="#a855f7" />
        <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Python Sandbox</text>
      </g>

      <!-- Badge 3: Cloud Firestore -->
      <g transform="translate(390, 0)">
        <rect width="180" height="42" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="22" cy="21" r="5" fill="#f59e0b" />
        <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Cloud Firestore</text>
      </g>
    </g>

    <!-- Bottom Specs Ribbon -->
    <g transform="translate(0, 235)">
      <text x="0" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        ✦ Multimodal Audio &amp; Files &nbsp;•&nbsp; ✦ KaTeX Math Equations &nbsp;•&nbsp; ✦ Galaxy Dynamic Logo &nbsp;•&nbsp; ✦ React 19 + TypeScript
      </text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="519" rx="15.5" stroke="#ffffff" stroke-opacity="0.12" fill="none" />
</svg>
